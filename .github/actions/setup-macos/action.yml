name: Setup macOS build deps
description: Install + cache mise tools and GhosttyKit build outputs

runs:
  using: composite
  steps:
    - name: Mise cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/mise
          ~/.cache/mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise-v0-${{ hashFiles('**/mise.toml', '**/.mise.toml', '**/.tool-versions', '**/.config/mise.toml', '**/mise/config.toml', '**/mise.lock', '**/.mise.lock', '**/mise/config.lock', '**/.config/mise.lock', '**/mise.*.toml', '**/.mise.*.toml', '**/.config/mise.*.toml', '**/mise.*.lock', '**/.mise.*.lock', '**/.config/mise.*.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-mise-v0-
    - run: brew install mise
      shell: bash
    - run: mise install
      shell: bash
    - run: brew install zig@0.15
      shell: bash
    - run: brew link zig@0.15 --force
      shell: bash

    - name: Setup libtool workaround for Xcode 16 / macOS 15
      shell: bash
      run: |
        mkdir -p .bin
        cat << 'WRAPPER' > .bin/libtool
        #!/bin/bash
        if [[ "$1" == "-static" && "$2" == "-o" ]]; then
            shift 2
            output="$1"
            shift
            basedir=$(mktemp -d)
            objs=()
            idx=0
            for arg in "$@"; do
                if [[ "$arg" == *.a ]]; then
                    cwd=$(pwd)
                    mkdir -p "$basedir/$idx"
                    cd "$basedir/$idx"
                    ar x "$cwd/$arg" 2>/dev/null || true
                    chmod -R 777 . 2>/dev/null || true
                    for f in *.o; do
                        if [[ -e "$f" ]]; then
                            mv "$f" "${idx}_${f}"
                            objs+=("$basedir/$idx/${idx}_${f}")
                        fi
                    done
                    cd "$cwd"
                    idx=$((idx+1))
                else
                    objs+=("$arg")
                fi
            done
            chmod -R 777 "$basedir" 2>/dev/null || true
            rm -f "$output"
            exec ar rcs "$output" "${objs[@]}"
        fi
        exec /usr/bin/libtool "$@"
        WRAPPER
        chmod +x .bin/libtool
        echo "$(pwd)/.bin" >> $GITHUB_PATH

    - name: Ghostty cache key
      shell: bash
      run: |
        set -euo pipefail
        GHOSTTY_SHA="$(git -C ThirdParty/ghostty rev-parse HEAD)"
        printf '%s\n' "GHOSTTY_SHA=$GHOSTTY_SHA" >> "$GITHUB_ENV"
    - name: Ghostty cache
      id: ghostty_cache
      uses: actions/cache@v4
      with:
        path: |
          Frameworks/GhosttyKit.xcframework
          Resources/ghostty
          Resources/terminfo
        key: ${{ runner.os }}-${{ runner.arch }}-ghostty-${{ env.GHOSTTY_SHA }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-ghostty-
    - name: Build ghostty
      if: steps.ghostty_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        make build-ghostty-xcframework

    - name: SPM cache
      uses: actions/cache@v4
      with:
        path: /tmp/cherrylily-spm-cache/SourcePackages
        key: ${{ runner.os }}-${{ runner.arch }}-spm-v0-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-spm-v0-

    - name: Xcode compilation cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-compilation-cache-v0
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-xcode-compilation-cache-
